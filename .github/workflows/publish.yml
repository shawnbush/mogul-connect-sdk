# Stages one package on npm per GitHub Release (`npm stage publish`). Nothing
# goes public until a maintainer approves the staged version with 2FA:
#
#   npm stage list @usemogul/<package>
#   npm stage download <stage-id>   # optional: inspect the tarball
#   npm stage approve <stage-id>    # publishes it (or `npm stage reject`)
#
# Tag each release `<package-dir>@<version>` — e.g. `connect-js@0.2.0` or
# `connect-common@0.2.0` (a leading `v` on the version is allowed). The version
# must already match that package's package.json. Pre-releases stage under the
# `next` dist-tag; everything else under `latest`. The tag is fixed at staging.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN. Each package needs a
# trusted publisher on npmjs.com matching this repo, this workflow's filename
# (`publish.yml`), and the `npm` environment, with stage publish allowed (and
# direct publish disallowed).
name: Stage publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Latest 24.x rather than the runner's cached one: `npm stage` needs the
          # npm >= 11.15.0 that recent 24.x releases bundle.
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no dependency cache in a job that holds publish credentials

      - name: Resolve package from release tag
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$TAG" =~ ^(connect-js|connect-common)@v?(.+)$ ]]; then
            echo "::error::Release tag '$TAG' must be <package>@<version>, e.g. connect-js@0.2.0"
            exit 1
          fi
          dir="packages/${BASH_REMATCH[1]}"
          tag_version="${BASH_REMATCH[2]}"
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::Tag version $tag_version does not match $dir/package.json version $version"
            exit 1
          fi
          # Staged versions aren't visible to `npm view`; if this version is
          # already staged, the registry rejects the stage below instead.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi
          dist_tag=latest
          if [[ "$PRERELEASE" == 'true' ]]; then dist_tag=next; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Staging $name@$version (dist-tag: $dist_tag)"

      - run: npm ci

      # Repo-wide checks; the package's own `prepublishOnly` (typecheck, test,
      # build, publint, attw) and `prepack` (build) run as part of
      # `npm stage publish` below.
      - run: npm run lint
      - run: npm run format:check

      - name: Stage
        run: npm stage publish --workspace "$NAME" --tag "$DIST_TAG"
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          DIST_TAG: ${{ steps.pkg.outputs.dist_tag }}
